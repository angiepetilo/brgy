[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
python_classes = Test* *Tests *TestCase
python_functions = test_*
testpaths = tests
# Verbose per-test output like `php artisan test`; short tracebacks; summary of skips/failures.
addopts = -v --tb=short -ra --strict-markers --disable-warnings
markers =
    slow: long-running tests
    mysql: tests that only make sense on MySQL
